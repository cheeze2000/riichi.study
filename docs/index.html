<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>riichi.study</title>
  <meta name="description" content="Riichi mahjong resources and tools for beginner players.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css">

  <style>
    :root {
      --theme-color: #6ab5e7;
      --font-size: 17px;
      --font-weight: 400;
      --strong-font-weight: 700;
      --content-margin-inline: 36px;
      --sidebar-toggle-width: 18px;
      --sidebar-toggle-height: 60px;
      --sidebar-group-title-font-size: 18px;
    }

    .sidebar-nav a:hover {
      text-decoration-thickness: 1px;
    }

    .sidebar-nav li.active>a {
      position: relative;
      color: var(--theme-color);
    }

    .sidebar-nav li.active>a::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--theme-color);
    }

    .tile-row {
      display: flex;
      align-items: flex-end;
      gap: 0.15em;
    }

    .tile-block {
      flex: 3;
      max-width: 1.8em;
      aspect-ratio: 3 / 4;
    }

    .tile-block--rotated {
      flex: 4;
      max-width: 2.4em;
      aspect-ratio: 4 / 3;
    }

    .tile-block--stacked {
      flex: 4;
      max-width: 2.4em;
      aspect-ratio: 36 / 57;
    }

    .tile-block--spacer-column {
      flex: 1;
      max-width: 0.6em;
    }

    .tile-block--spacer-row {
      height: 0.15em;
    }

    .tile-inline {
      height: 1.65em;
      width: auto;
      vertical-align: -0.3em;
      display: inline-block;
    }

    .tile-inline--rotated {
      width: 1.65em;
      height: auto;
      vertical-align: -0.3em;
      display: inline-block;
    }
  </style>
</head>

<body class="sidebar-chevron-right sidebar-group-box">
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "riichi.study",
      repo: "cheeze2000/riichi.study",
      search: "auto",
      auto2top: true,
      loadSidebar: true,
      subMaxLevel: 2,

      markdown: {
        renderer: {
          code({ lang, text }) {
            if (lang !== "mj") {
              return this.origin.code.apply(this, arguments);
            }

            const rows = [];
            const lines = text.split("\n");

            for (const line of lines) {
              const svg = renderMahjongSvg("block", line);
              const row = `<div class="tile-row">${svg}</div>`;

              rows.push(row);
            }

            return rows.join(`<div class="tile-block--spacer-row"></div>`);
          },
          codespan({ text }) {
            if (!text.startsWith("mj ")) {
              return `<code>${text}</code>`;
            }

            const svg = renderMahjongSvg("inline", text.slice(3));

            return `<span style="margin: 0 0.15em">${svg}</span>`;
          },
        },
      },
    }
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <script src="_scripts/mahjong-plugin.js"></script>
  <script type="module">
    import { inject } from "https://esm.sh/@vercel/analytics";
    inject();
  </script>
</body>

</html>
