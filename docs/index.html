<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>riichi.study</title>
  <meta name="description" content="Riichi mahjong resources and tools for players of all levels.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css">

  <style>
    :root {
      --theme-color: #6ab5e7;
      --font-size: 17px;
      --font-weight: 400;
      --strong-font-weight: 700;
      --sidebar-group-title-font-size: 18px;
    }

    .sidebar-nav a:hover {
      text-decoration-thickness: 1px;
    }

    .sidebar-nav li.active>a {
      position: relative;
      color: var(--theme-color);
    }

    .sidebar-nav li.active>a::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--theme-color);
    }

    .tile-block {
      width: auto;
      height: 2.4em;
      display: inline-block;
    }

    .tile-block--rotated {
      width: 2.4em;
      height: auto;
      display: inline-block;
    }

    .tile-inline {
      height: 1.65em;
      width: auto;
      vertical-align: -0.3em;
      display: inline-block;
    }

    .tile-inline--rotated {
      width: 1.65em;
      height: auto;
      vertical-align: -0.3em;
      display: inline-block;
    }
  </style>
</head>

<body class="sidebar-chevron-right sidebar-group-box">
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "riichi.study",
      repo: "cheeze2000/riichi.study",
      search: "auto",
      loadSidebar: true,
      subMaxLevel: 2,

      markdown: {
        renderer: {
          code({ lang, text }) {
            if (lang !== "mj") {
              return this.origin.code.apply(this, arguments);
            }

            const svg = renderMahjongSvg("block", text);

            return `<div>${svg}</div>`;
          },
          codespan({ text }) {
            if (!text.startsWith("mj ")) {
              return `<code>${text}</code>`;
            }

            const svg = renderMahjongSvg("inline", text.slice(3));

            return `<span style="margin: 0 0.15em">${svg}</span>`;
          },
        },
      },
    }
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <script src="_scripts/mahjong-plugin.js"></script>
</body>

</html>
